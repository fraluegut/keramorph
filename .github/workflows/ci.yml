# ─────────────────────────────────────────────
# Keramorph CI/CD – GitHub Actions
# ─────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Python lint + test ────────────────────
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        continue-on-error: true
        run: ruff check ml/ services/ tests/

      - name: Type check
        continue-on-error: true
        run: mypy ml/ services/ --ignore-missing-imports

      - name: Tests
        run: pytest tests/ -v --tb=short --junitxml=reports/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  # ── Frontend lint + build ─────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── Docker build ──────────────────────────
  docker:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t keramorph-api:${{ github.sha }} .

      - name: Build Frontend image
        run: docker build -f infra/docker/Dockerfile.frontend -t keramorph-front:${{ github.sha }} .

      # TODO: push to container registry
      # - name: Push
      #   run: |
      #     docker tag keramorph-api:${{ github.sha }} ghcr.io/${{ github.repository }}/api:latest
      #     docker push ghcr.io/${{ github.repository }}/api:latest
